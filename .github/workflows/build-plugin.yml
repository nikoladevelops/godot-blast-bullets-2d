name: Build GDExtension Cross Platform Plugin

on:
  workflow_dispatch:
    inputs:
      lto_linux:
        description: "LTO mode for Linux builds"
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: auto
      lto_windows:
        description: "LTO mode for Windows builds"
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: auto
      lto_macos:
        description: "LTO mode for macOS builds"
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: auto
      lto_android:
        description: "LTO mode for Android builds"
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: auto
      lto_ios:
        description: "LTO mode for iOS builds"
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: auto
      lto_web:
        description: "LTO mode for standard Web (non-threaded) builds"
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: auto
      lto_web_threads:
        description: "LTO mode for threaded Web builds WARNING: Must stay 'none'! LTO is broken/unsupported for threaded web builds."
        required: true
        type: choice
        options:
          - none
          - auto
          - full
          - thin
        default: none
      use_cache:
        description: "Use Cache: Speed up compilation using SCons caching."
        required: false
        type: boolean
        default: true
      clear_all_cache:
        description: "Clear All Cache: Clear all GitHub Actions caches before building."
        required: false
        type: boolean
        default: false

jobs:
  init-config:
    runs-on: ubuntu-22.04
    outputs:
      plugin_name: ${{ steps.get-name.outputs.plugin_name }}
      target_types: ${{ steps.set-matrix.outputs.target_types }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read plugin name from config.json
        id: get-name
        run: |
          PLUGIN_NAME=$(python3 -c "from tools.config_manager import config; print(config.getPluginName())")
          echo "plugin_name=$PLUGIN_NAME" >> $GITHUB_OUTPUT

      - name: Set matrix values
        id: set-matrix
        run: |
          echo "target_types=['template_release']" >> $GITHUB_OUTPUT

  clear-cache:
    runs-on: ubuntu-22.04
    needs: init-config
    permissions:
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Clear all caches
        if: ${{ github.event.inputs.clear_all_cache == 'true' }}
        run: |
          echo "About to clear all caches"
          gh cache delete --all --succeed-on-no-caches
          echo "Clear completed"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build:
    needs: [init-config, clear-cache]
    strategy:
      fail-fast: false
      matrix:
        target:
          [
            { platform: linux, arch: x86_32, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: linux, arch: x86_64, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: linux, arch: arm32, os: ubuntu-22.04-arm, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: linux, arch: arm64, os: ubuntu-22.04-arm, lto_input: "${{ github.event.inputs.lto_linux }}" },
            { platform: windows, arch: x86_32, os: windows-latest, lto_input: "${{ github.event.inputs.lto_windows }}" },
            { platform: windows, arch: x86_64, os: windows-latest, lto_input: "${{ github.event.inputs.lto_windows }}" },
            { platform: windows, arch: arm64, os: windows-latest, lto_input: "${{ github.event.inputs.lto_windows }}" },
            { platform: macos, arch: universal, os: macos-latest, lto_input: "${{ github.event.inputs.lto_macos }}" },
            { platform: android, arch: x86_64, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_android }}" },
            { platform: android, arch: arm32, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_android }}" },
            { platform: android, arch: arm64, os: ubuntu-22.04, lto_input: "${{ github.event.inputs.lto_android }}" },
            { platform: ios, arch: arm64, os: macos-latest, lto_input: "${{ github.event.inputs.lto_ios }}" },
            { platform: web, arch: wasm32, os: ubuntu-22.04, threads: "no", lto_input: "${{ github.event.inputs.lto_web }}" },
            { platform: web, arch: wasm32, os: ubuntu-22.04, threads: "yes", lto_input: "${{ github.event.inputs.lto_web_threads }}" }
          ]
        target-type: ${{ fromJson(needs.init-config.outputs.target_types) }}

    env:
      PLUGIN_NAME: ${{ needs.init-config.outputs.plugin_name }}
      CI: "true"

    runs-on: ${{ matrix.target.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Set build name
        id: set-build-name
        shell: bash
        run: |
          NAME="${{ env.PLUGIN_NAME }}.${{ matrix.target.platform }}.${{ matrix.target-type }}.${{ matrix.target.arch }}.single${{ (matrix.target.platform == 'web' && matrix.target.threads == 'yes') && '.threads' || '' }}"
          echo "build_name=$NAME" >> $GITHUB_OUTPUT
          echo "cache_name=${NAME//./_}_${{ matrix.target.lto_input }}" >> $GITHUB_OUTPUT

      - name: Install multilib support
        if: ${{ matrix.target.platform == 'linux' && matrix.target.arch == 'x86_32' }}
        run: |
          sudo apt-get update && sudo apt-get install -y gcc-multilib g++-multilib

      - name: Setup godot-cpp (Non-Windows)
        if: ${{ matrix.target.platform != 'windows' }}
        uses: ./godot-cpp/.github/actions/setup-godot-cpp
        with:
          platform: ${{ matrix.target.platform }}
          em-version: 3.1.62

      - name: Setup MSVC Environment (Windows)
        if: ${{ matrix.target.platform == 'windows' }}
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.target.arch == 'x86_32' && 'x86' || (matrix.target.arch == 'arm64' && 'arm64' || 'x64') }}

      - name: Setup Python (Windows)
        if: ${{ matrix.target.platform == 'windows' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Set SCONS_CACHE
        if: ${{ github.event.inputs.use_cache == 'true' }}
        shell: bash
        run: echo "SCONS_CACHE=${{ github.workspace }}/.scons-cache/${{ steps.set-build-name.outputs.cache_name }}" >> $GITHUB_ENV

      - name: Restore .scons_cache
        if: ${{ github.event.inputs.use_cache == 'true' }}
        uses: ./godot-cpp/.github/actions/godot-cache-restore
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/${{ steps.set-build-name.outputs.cache_name }}
          cache-name: ${{ steps.set-build-name.outputs.cache_name }}

      - name: Inspect Active Compiler Toolchain
        shell: bash
        run: |
          echo "=================================================="
          echo "Platform: ${{ matrix.target.platform }}"
          echo "Architecture: ${{ matrix.target.arch }}"
          echo "Operating System Runner: ${{ matrix.target.os }}"
          if [ "${{ matrix.target.platform }}" = "windows" ]; then
            echo "Compiler Info:"
            cl.exe 2>&1 || true
            which cl.exe || true
          elif [ "${{ matrix.target.platform }}" = "linux" ] || [ "${{ matrix.target.platform }}" = "android" ]; then
            echo "GCC Version:"
            gcc --version || true
            echo "G++ Version:"
            g++ --version || true
          elif [ "${{ matrix.target.platform }}" = "macos" ] || [ "${{ matrix.target.platform }}" = "ios" ]; then
            echo "Clang Version:"
            clang --version || true
          elif [ "${{ matrix.target.platform }}" = "web" ]; then
            echo "Emscripten Version:"
            emcc --version || true
          fi
          echo "=================================================="

      - name: Build GDExtension (Windows MSVC)
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install scons

          # Add Python Scripts directory to PATH so 'scons' is available as a command
          $pythonScriptsPath = python -c "import sysconfig; print(sysconfig.get_path('scripts'))"
          Write-Host "Adding Python Scripts to PATH: $pythonScriptsPath"
          $env:PATH = "$env:PATH;$pythonScriptsPath"

          # Verify scons is accessible
          scons --version

          if ($env:SCONS_CACHE) {
              $env:SCONS_CACHE = [System.IO.Path]::GetFullPath($env:SCONS_CACHE)
              if (!(Test-Path $env:SCONS_CACHE)) {
                  New-Item -ItemType Directory -Force -Path $env:SCONS_CACHE | Out-Null
              }
          }

          $ltoFlag = ""
          if ("${{ matrix.target.lto_input }}" -ne "none") {
              $ltoFlag = " lto=${{ matrix.target.lto_input }}"
          }

          $sconsCmd = "scons target=${{ matrix.target-type }} platform=windows arch=${{ matrix.target.arch }} precision=single$ltoFlag"
          Write-Host "Running: $sconsCmd"
          Invoke-Expression $sconsCmd

      - name: Build GDExtension (Non-Windows)
        if: ${{ matrix.target.platform != 'windows' }}
        shell: bash
        run: |
          THREADS_FLAG=""
          if [ "${{ matrix.target.platform }}" = "web" ]; then
            THREADS_FLAG=" threads=${{ matrix.target.threads }}"
          fi

          LTO_FLAG=""
          if [ "${{ matrix.target.lto_input }}" != "none" ]; then
            LTO_FLAG=" lto=${{ matrix.target.lto_input }}"
          fi

          scons target=${{ matrix.target-type }} \
                platform=${{ matrix.target.platform }} \
                arch=${{ matrix.target.arch }} \
                precision=single \
                $THREADS_FLAG \
                $LTO_FLAG

      - name: Save .scons_cache
        if: ${{ github.event.inputs.use_cache == 'true' }}
        uses: ./godot-cpp/.github/actions/godot-cache-save
        with:
          scons-cache: ${{ github.workspace }}/.scons-cache/${{ steps.set-build-name.outputs.cache_name }}
          cache-name: ${{ steps.set-build-name.outputs.cache_name }}

      - name: Windows - Delete compilation files
        if: ${{ matrix.target.platform == 'windows' }}
        shell: pwsh
        run: Remove-Item bin/* -Include *.exp,*.lib,*.pdb -Force

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.set-build-name.outputs.build_name }}
          path: ${{ github.workspace }}/bin
          retention-days: 1

  merge:
    runs-on: ubuntu-22.04
    needs: [init-config, build]
    env:
      PLUGIN_NAME: ${{ needs.init-config.outputs.plugin_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Organize release package structure
        run: |
          STAGING_DIR="addons/${{ env.PLUGIN_NAME }}"
          mkdir -p "$STAGING_DIR/bin"

          for platform_dir in artifacts/*; do
            [ -d "$platform_dir" ] || continue
            for p in $(find "$platform_dir" -mindepth 1 -maxdepth 1 -type d); do
              platform_name=$(basename "$p")
              mkdir -p "$STAGING_DIR/bin/$platform_name"
              cp -R "$p/"* "$STAGING_DIR/bin/$platform_name/" || true
            done
          done

          # Copy icons folder if it exists
          if [ -d "icons" ]; then
            cp -R "icons" "$STAGING_DIR/icons"
          fi

          # Force .gdextension manifest entries to release mode right before copying
          python3 -c "from tools.gdextension_file_helper import force_editor_target_to_release; force_editor_target_to_release()"

          # Copy .gdextension manifest if it exists
          if [ -f "${{ env.PLUGIN_NAME }}.gdextension" ]; then
            cp "${{ env.PLUGIN_NAME }}.gdextension" "$STAGING_DIR/${{ env.PLUGIN_NAME }}.gdextension"
          fi

          # Safely copy any README variant if it exists
          find . -maxdepth 1 -iname "readme*" -type f | head -n 1 | while read -r readme_file; do
            if [ -n "$readme_file" ] && [ -f "$readme_file" ]; then
              cp "$readme_file" "$STAGING_DIR/"
              echo "Included README: $readme_file"
            fi
          done

          # Safely copy any LICENSE variant if it exists
          find . -maxdepth 1 -iname "license*" -type f | head -n 1 | while read -r license_file; do
            if [ -n "$license_file" ] && [ -f "$license_file" ]; then
              cp "$license_file" "$STAGING_DIR/"
              echo "Included LICENSE: $license_file"
            fi
          done

      - name: Create zip archive
        run: |
          zip -r "${{ env.PLUGIN_NAME }}.zip" addons

      - name: Upload final artifact
        uses: actions/upload-artifact@v4
        with:
          name: "finished_unzip_me"
          path: "${{ env.PLUGIN_NAME }}.zip"
          retention-days: 1
